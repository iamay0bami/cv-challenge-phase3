services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web_net"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - web_net

  cv-db:
    image: postgres:14
    container_name: cv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changethis123
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net

  cv-backend:
    # CI Pipeline will replace this tag
    image: iamay0bami/backend:a2117c2b18f97ce455aedeb2508636d884710cc9
    container_name: cv-backend
    restart: always
    environment:
      # We use ${DOMAIN} which will be set on the server during CD
      - DOMAIN=${DOMAIN}
      - ENVIRONMENT=production
      - PROJECT_NAME=Full Stack FastAPI Project
      - STACK_NAME=full-stack-fastapi-project
      - API_V1_STR=/api/v1
      - SECRET_KEY=changethis123
      - FIRST_SUPERUSER=admin@example.com
      - FIRST_SUPERUSER_PASSWORD=changethis123
      - POSTGRES_SERVER=cv-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=changethis123
      # Hardcoding CORS for simplicity or using ${DOMAIN}
      - BACKEND_CORS_ORIGINS=http://${DOMAIN},http://localhost,http://localhost:5173
    # THE CRITICAL DB SEEDING COMMAND
    command: >
      bash -c "PYTHONPATH=/app alembic upgrade head && 
               PYTHONPATH=/app python app/initial_data.py && 
               uvicorn app.main:app --host 0.0.0.0 --port 8000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_net"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api/v1`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    networks:
      - app_net
      - web_net
    depends_on:
      - cv-db

  cv-frontend:
    # CI Pipeline will replace this tag
    image: iamay0bami/frontend:a2117c2b18f97ce455aedeb2508636d884710cc9
    container_name: cv-frontend
    restart: always
    environment:
      - VITE_API_URL=http://${DOMAIN}/api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - web_net
    depends_on:
      - cv-backend

networks:
  web_net:
    external: true
  app_net:
    driver: bridge

volumes:
  postgres_data: